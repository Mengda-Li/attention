[project]
name = "attention"
version = "0.1.0"
requires-python = ">=3.13.0"
dependencies = [
  "jupyter>=1.1.1",
  "matplotlib>=3.10.8",
  "numpy>=2.4.1",
  "pandas>=3.0.0",
  "scikit-learn>=1.8.0",
  "scipy>=1.15.0",
  "seaborn>=0.13.2",
  "torch>=2.10.0",
  "torchvision",
  "tqdm>=4.67.1",
  "transformers>=5.2.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.uv]
torch-backend = "auto"
